name: Ops Al Amana Investor Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Export Al Amana investor audit
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: qidra-production-read-only-report
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate Qidra production scope
        shell: bash
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required Qidra production secret ${key}"
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust Qidra deploy host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          port="${DEPLOY_PORT:-22}"
          if [[ -n "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Export read-only production audit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          port="${DEPLOY_PORT:-22}"

          export_csv() {
            local output="$1"
            ssh -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -euo pipefail; \
               container_id=\"\$(docker ps \
                 --filter 'label=com.docker.compose.project.working_dir=${DEPLOY_PATH}' \
                 --filter 'label=com.docker.compose.service=postgres' \
                 --format '{{.ID}}')\"; \
               [[ \"\$container_id\" =~ ^[0-9a-f]+$ ]]; \
               docker exec -i \"\$container_id\" \
                 sh -lc 'psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" --csv'" \
              > "$output"
            chmod 600 "$output"
            test -s "$output"
          }

          export_csv al-amana-active-investors.csv <<'SQL'
          SELECT
            CASE
              WHEN GROUPING(u.id) = 1 THEN 'ИТОГО'
              ELSE COALESCE(NULLIF(BTRIM(u.name), ''), 'Имя не указано')
            END AS "Инвестор",
            COUNT(*)::integer AS "Активных договоров",
            ROUND(SUM(ia."amountUsdt")::numeric, 2) AS "Сумма инвестиций, USDT"
          FROM "InvestmentApplication" ia
          JOIN "Project" p ON p.id = ia."projectId"
          JOIN "User" u ON u.id = ia."userId"
          WHERE p.slug = 'al-amana-gold'
            AND p."payoutFrequency" = 'QUARTERLY'
            AND ia.status = 'CONFIRMED'
            AND ia."closedAt" IS NULL
          GROUP BY GROUPING SETS ((u.id, u.name), ())
          ORDER BY GROUPING(u.id), "Инвестор";
          SQL

          export_csv al-amana-all-contracts.csv <<'SQL'
          SELECT
            COALESCE(NULLIF(BTRIM(u.name), ''), 'Имя не указано') AS "Инвестор",
            p.slug AS "Проект slug",
            p."titleRu" AS "Проект",
            p."payoutFrequency"::text AS "Периодичность",
            p.status::text AS "Статус проекта",
            ia.status::text AS "Статус договора",
            ROUND(ia."amountUsdt"::numeric, 2) AS "Сумма, USDT",
            ia."contractAcceptedAt" AS "Принят договор",
            ia."closedAt" AS "Закрыт",
            ia."createdAt" AS "Создан",
            ia."adminNote" AS "Источник"
          FROM "InvestmentApplication" ia
          JOIN "Project" p ON p.id = ia."projectId"
          JOIN "User" u ON u.id = ia."userId"
          WHERE p.slug ILIKE '%amana%'
             OR p."titleRu" ILIKE '%amana%'
             OR p."titleEn" ILIKE '%amana%'
             OR ia."adminNote" ILIKE '%Al Amana%'
          ORDER BY u.name, ia."createdAt";
          SQL

          export_csv al-amana-contract-summary.csv <<'SQL'
          SELECT
            p.slug AS "Проект slug",
            p."titleRu" AS "Проект",
            p."payoutFrequency"::text AS "Периодичность",
            ia.status::text AS "Статус договора",
            CASE WHEN ia."closedAt" IS NULL THEN 'OPEN' ELSE 'CLOSED_DATE' END AS "Закрытие",
            COUNT(*)::integer AS "Договоров",
            COUNT(DISTINCT ia."userId")::integer AS "Инвесторов",
            ROUND(SUM(ia."amountUsdt")::numeric, 2) AS "Сумма, USDT"
          FROM "InvestmentApplication" ia
          JOIN "Project" p ON p.id = ia."projectId"
          WHERE p.slug ILIKE '%amana%'
             OR p."titleRu" ILIKE '%amana%'
             OR p."titleEn" ILIKE '%amana%'
             OR ia."adminNote" ILIKE '%Al Amana%'
          GROUP BY p.id, p.slug, p."titleRu", p."payoutFrequency", ia.status,
            CASE WHEN ia."closedAt" IS NULL THEN 'OPEN' ELSE 'CLOSED_DATE' END
          ORDER BY p.slug, ia.status, "Закрытие";
          SQL

          export_csv al-amana-imported-users.csv <<'SQL'
          SELECT
            COALESCE(NULLIF(BTRIM(u.name), ''), 'Имя не указано') AS "Инвестор",
            COUNT(ia.id)::integer AS "Всего договоров",
            COUNT(ia.id) FILTER (
              WHERE ia.status = 'CONFIRMED' AND ia."closedAt" IS NULL
            )::integer AS "Активных подтвержденных",
            ROUND(COALESCE(SUM(ia."amountUsdt"), 0)::numeric, 2) AS "Сумма всех договоров, USDT",
            COALESCE(
              STRING_AGG(DISTINCT p.slug, ', ' ORDER BY p.slug),
              'без проекта'
            ) AS "Проекты"
          FROM "User" u
          LEFT JOIN "InvestmentApplication" ia ON ia."userId" = u.id
          LEFT JOIN "Project" p ON p.id = ia."projectId"
          WHERE u.email ILIKE 'al-amana-%@qidra.import'
          GROUP BY u.id, u.name
          ORDER BY u.name;
          SQL

          export_csv al-amana-dividend-history.csv <<'SQL'
          SELECT
            COALESCE(NULLIF(BTRIM(u.name), ''), 'Имя не указано') AS "Инвестор",
            p.slug AS "Проект slug",
            pdp."periodLabel" AS "Период",
            pdp.status::text AS "Статус периода",
            dp.status::text AS "Статус выплаты",
            ROUND(dp."investmentAmountUsdt"::numeric, 2) AS "Инвестиция, USDT",
            ROUND(dp."amountUsdt"::numeric, 2) AS "Дивиденд, USDT",
            dp."paidAt" AS "Выплачено"
          FROM "DividendPayment" dp
          JOIN "ProjectDividendPeriod" pdp ON pdp.id = dp."periodId"
          JOIN "InvestmentApplication" ia ON ia.id = dp."investmentId"
          JOIN "Project" p ON p.id = pdp."projectId"
          JOIN "User" u ON u.id = dp."userId"
          WHERE p.slug ILIKE '%amana%'
             OR p."titleRu" ILIKE '%amana%'
             OR p."titleEn" ILIKE '%amana%'
             OR ia."adminNote" ILIKE '%Al Amana%'
          ORDER BY pdp."periodStart", u.name;
          SQL

          export_csv al-amana-reinvestment-preferences.csv <<'SQL'
          SELECT DISTINCT
            COALESCE(NULLIF(BTRIM(u.name), ''), 'Имя не указано') AS "Инвестор",
            COALESCE(arp.enabled, false) AS "Автореинвест включен",
            arp."allocationPercent" AS "Доля автореинвеста, %",
            target.slug AS "Целевой проект",
            arp."acceptedAt" AS "Подтверждено"
          FROM "InvestmentApplication" ia
          JOIN "Project" p ON p.id = ia."projectId"
          JOIN "User" u ON u.id = ia."userId"
          LEFT JOIN "AutoReinvestmentPreference" arp ON arp."userId" = u.id
          LEFT JOIN "Project" target ON target.id = arp."targetProjectId"
          WHERE p.slug = 'al-amana-gold'
            AND p."payoutFrequency" = 'QUARTERLY'
            AND ia.status = 'CONFIRMED'
            AND ia."closedAt" IS NULL
          ORDER BY "Инвестор";
          SQL

          export_csv qidra-all-reinvestment-preferences.csv <<'SQL'
          SELECT
            COALESCE(NULLIF(BTRIM(u.name), ''), 'Имя не указано') AS "Инвестор",
            u.email AS "Email",
            arp.enabled AS "Автореинвест включен",
            arp."allocationPercent" AS "Доля автореинвеста, %",
            target.slug AS "Целевой проект",
            arp."acceptedAt" AS "Подтверждено пользователем",
            arp."termsVersion" AS "Версия условий",
            arp."updatedAt" AS "Последнее изменение"
          FROM "AutoReinvestmentPreference" arp
          JOIN "User" u ON u.id = arp."userId"
          JOIN "Project" target ON target.id = arp."targetProjectId"
          ORDER BY arp.enabled DESC, "Инвестор";
          SQL

          export_csv al-amana-q3-payout-verification.csv <<'SQL'
          SELECT
            COALESCE(NULLIF(BTRIM(u.name), ''), 'Имя не указано') AS "Инвестор",
            pdp."periodLabel" AS "Период",
            pdp.status::text AS "Статус периода",
            dp.status::text AS "Статус выплаты",
            ROUND(dp."amountUsdt"::numeric, 2) AS "Дивиденд, USDT",
            dp."paidAt" AS "Выплачено",
            ROUND(w."availableUsdt"::numeric, 2) AS "Доступный баланс, USDT",
            wt.type::text AS "Тип операции",
            wt.status::text AS "Статус операции",
            ROUND(wt."amountUsdt"::numeric, 2) AS "Сумма операции, USDT",
            wt.note AS "Назначение операции",
            COUNT(n.id)::integer AS "Уведомлений о дивиденде"
          FROM "DividendPayment" dp
          JOIN "ProjectDividendPeriod" pdp ON pdp.id = dp."periodId"
          JOIN "Project" p ON p.id = pdp."projectId"
          JOIN "User" u ON u.id = dp."userId"
          JOIN "WalletTransaction" wt ON wt.id = dp."walletTransactionId"
          JOIN "Wallet" w ON w.id = wt."walletId" AND w."userId" = dp."userId"
          LEFT JOIN "Notification" n
            ON n."userId" = dp."userId"
           AND n.type = 'dividend'
           AND n."bodyRu" LIKE '%' || pdp."periodLabel" || '%'
           AND n."createdAt" BETWEEN dp."paidAt" - INTERVAL '1 minute' AND dp."paidAt" + INTERVAL '1 minute'
          WHERE p.slug = 'al-amana-gold'
            AND pdp."periodLabel" = '2026 Q3'
          GROUP BY u.id, u.name, pdp."periodLabel", pdp.status, dp.id, dp.status,
            dp."amountUsdt", dp."paidAt", w."availableUsdt", wt.id, wt.type,
            wt.status, wt."amountUsdt", wt.note
          ORDER BY "Инвестор";
          SQL

          export_csv al-amana-q3-admin-audit.csv <<'SQL'
          SELECT
            aal.action AS "Действие",
            aal."entityType" AS "Тип объекта",
            aal."entityId" AS "ID объекта",
            aal.payload AS "Детали",
            aal."createdAt" AS "Дата"
          FROM "AdminAuditLog" aal
          JOIN "ProjectDividendPeriod" pdp ON pdp.id = aal."entityId"
          JOIN "Project" p ON p.id = pdp."projectId"
          WHERE aal.action = 'dividend.pay'
            AND p.slug = 'al-amana-gold'
            AND pdp."periodLabel" = '2026 Q3'
          ORDER BY aal."createdAt" DESC;
          SQL

      - name: Upload private report
        uses: actions/upload-artifact@v4
        with:
          name: al-amana-investor-audit-${{ github.run_id }}
          path: |
            al-amana-*.csv
            qidra-all-reinvestment-preferences.csv
          if-no-files-found: error
          retention-days: 1
